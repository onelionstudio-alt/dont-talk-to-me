<body><div id="wrap"><canvas id="game" width="960" height="540" aria-label="Don't Talk to Me platform game"></canvas></div><div id="touch"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button><button id="jump" aria-label="Jump">JUMP</button></div><button id="pause" aria-label="Pause">Ⅱ</button><div id="hint">← → MOVE &nbsp; • &nbsp; SPACE / ↑ JUMP &nbsp; • &nbsp; P PAUSE</div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=960,H=540;

{name:'CLASS DISMISSED',place:'MONDAY, 9:45 AM',world:2050,ground:450,theme:1,platforms:[{x:260,y:375,w:180},{x:560,y:345,w:170},{x:910,y:375,w:145},{x:1250,y:343,w:185},{x:1660,y:357,w:170}],enemies:[{x:440,kind:1,min:370,max:570},{x:820,kind:0,min:730,max:990},{x:1160,kind:2,min:1100,max:1320},{x:1690,kind:0,min:1600,max:1850}],coins:[185,312,375,610,660,970,1020,1310,1390,1750,1835]},
{name:'THE BELL RINGS',place:'MONDAY, 12:20 PM',world:2250,ground:450,theme:0,platforms:[{x:305,y:365,w:140},{x:625,y:345,w:180},{x:1030,y:356,w:160},{x:1395,y:353,w:155},{x:1800,y:347,w:180}],enemies:[{x:460,kind:2,min:400,max:620},{x:880,kind:0,min:780,max:1010},{x:1260,kind:1,min:1210,max:1410},{x:1640,kind:2,min:1550,max:1760},{x:1980,kind:0,min:1900,max:2110}],coins:[230,340,400,675,745,1080,1150,1445,1505,1860,1925,2120]},

{name:'LAST BELL',place:'FRIDAY, 3:00 PM',world:2650,ground:450,theme:2,platforms:[{x:300,y:355,w:155},{x:645,y:350,w:150},{x:1040,y:370,w:175},{x:1400,y:345,w:165},{x:1785,y:350,w:150},{x:2170,y:355,w:190}],enemies:[{x:445,kind:0,min:390,max:610},{x:865,kind:2,min:795,max:1030},{x:1230,kind:1,min:1170,max:1390},{x:1600,kind:0,min:1500,max:1720},{x:1970,kind:2,min:1880,max:2130},{x:2360,kind:3,min:2290,max:2550}],coins:[218,350,408,690,744,1085,1170,1460,1530,1840,1900,2220,2300,2490]}
];
let state='title',level=0,world,player,camera=0,battery=100,coins=saved.coins||0,earned=0,frame=0,time=0,shake=0,caption='',captionTimer=0,paused=false,last=0;
const phrases=['HEY! WAIT!','CAN WE TALK?','A QUICK QUESTION!','GROUP HUG!','HOMEWORK!','HOW WAS SCHOOL?'];
function persist(){try{localStorage.setItem(saveKey,JSON.stringify({level:Math.max(saved.level,level),coins}))}catch(e){}}
function startLevel(i){level=i;world=JSON.parse(JSON.stringify(LEVELS[i]));world.enemies.forEach((e,k)=>{e.v=(k%2?-.8:.8)*(e.kind===2?1.65:e.kind===3?1.3:1);e.cool=0});world.coins=world.coins.map((x,i)=>({x,y:i%3===0?320:i%3===1?412:390,taken:false}));player={x:60,y:world.ground-58,w:29,h:58,vx:0,vy:0,grounded:false,inv:0,jumpLatch:false};camera=0;battery=100;earned=0;caption='';captionTimer=0;state='play';paused=false;keys.left=keys.right=keys.jump=false}
function restart(){startLevel(level)}
function jump(){if(player.grounded){player.vy=-12.6;player.grounded=false;player.jumpLatch=true}}
function inputStart(a){keys[a]=true;if(a==='jump'&&state==='play'&&!paused)jump();else if(state!=='play'){if(state==='title'){startLevel(Math.min(saved.level,4))}else if(state==='done'){startLevel(0)}else if(state==='fail'){restart()}else if(state==='win'){if(level<4)startLevel(level+1);else state='done'}}}
document.addEventListener('keydown',e=>{let a=e.code==='ArrowLeft'||e.code==='KeyA'?'left':e.code==='ArrowRight'||e.code==='KeyD'?'right':e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'?'jump':null;if(a){e.preventDefault();if(!e.repeat)inputStart(a)}if(e.code==='KeyP'||e.code==='Escape'){paused=!paused;e.preventDefault()}if(e.code==='KeyR'&&state==='play')restart()});
document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.jump=false});
window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false;if(state==='play')paused=true});
for(const a of ['left','right','jump']){const b=document.getElementById(a);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);inputStart(a)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{e.preventDefault();keys[a]=false})}
document.getElementById('pause').addEventListener('click',()=>{if(state==='play')paused=!paused});
c.addEventListener('pointerdown',()=>{if(state==='title')startLevel(Math.min(saved.level,4));else if(state==='fail')restart();else if(state==='win'){if(level<4)startLevel(level+1);else state='done'}else if(state==='done')startLevel(0);else if(paused)paused=false});
function update(dt){frame+=dt;time+=dt;if(captionTimer>0)captionTimer-=dt;if(state!=='play'||paused)return;
const p=player,g=world.ground,oldY=p.y;let acc=keys.right?0.75:keys.left?-.75:0;p.vx=clamp((p.vx+acc)*(acc?.91:.79),-5.3,5.3);p.x=clamp(p.x+p.vx,10,world.world-p.w-12);
p.vy=clamp(p.vy+0.59,-14,14);p.y+=p.vy;p.grounded=false;
if(oldY+p.h<=g+12&&p.y+p.h>=g&&p.vy>=0){p.y=g-p.h;p.vy=0;p.grounded=true}
for(const plat of world.platforms){if(p.vy>=0&&oldY+p.h<=plat.y+7&&p.y+p.h>=plat.y&&p.x+p.w>plat.x+6&&p.x<plat.x+plat.w-6){p.y=plat.y-p.h;p.vy=0;p.grounded=true}}
if(keys.jump&&!p.jumpLatch&&p.grounded)jump();if(!keys.jump)p.jumpLatch=false;
if(p.inv>0)p.inv-=dt;
for(let i=0;i<world.coins.length;i++){let coin=world.coins[i];if(!coin.taken&&Math.abs(p.x+p.w/2-coin.x)<27&&Math.abs(p.y+p.h/2-coin.y)<43){coin.taken=true;coins++;earned++;caption='+1';captionTimer=25;persist()}}
for(let i=0;i<world.enemies.length;i++){let e=world.enemies[i];e.x+=e.v*dt;if(e.x<e.min||e.x>e.max){e.x=clamp(e.x,e.min,e.max);e.v*=-1}if(e.cool>0)e.cool-=dt;let dx=(p.x+14)-(e.x+17),dy=(p.y+30)-(g-28);let detect=Math.abs(dx)<(e.kind===2?150:115)&&Math.abs(dy)<100;if(detect&&Math.abs(dx)>44){e.v=clamp(e.v+Math.sign(dx)*.07*dt,-(e.kind===2?2.6:1.65),(e.kind===2?2.6:1.65))}if(Math.abs(dx)<27&&Math.abs(dy)<55&&p.inv<=0){let hit=[15,22,27,38][e.kind];battery-=hit;p.inv=75;e.cool=40;p.vx=(dx>=0?6:-6);p.vy=-5.8;shake=9;caption=phrases[e.kind===3?5:e.kind===2?3:e.kind===1?4:0]+'  -'+hit;captionTimer=75;if(battery<=0){battery=0;state='fail';persist()}}}
if(p.x>world.world-110){state='win';saved.level=Math.max(saved.level,Math.min(level+1,4));persist()}
camera=clamp(p.x-310,0,Math.max(0,world.world-W));shake=Math.max(0,shake-.45*dt)}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function txt(t,x,y,size=20,color='#fff',align='left',weight=800){ctx.font=weight+' '+size+'px system-ui';ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}
function background(){const themes=[['#10213a','#20324c','#30465c'],['#2d1f39','#42324a','#60495a'],['#1c3046','#2c4b5b','#416270']],colors=themes[world?world.theme:0];rect(0,0,W,H,colors[0]);let step=220,off=(camera*.28)%step;for(let i=-1;i<7;i++){let x=i*step-off;rect(x+40,70,112,270,colors[2]);rect(x+47,77,98,249,'#152c43');rect(x+54,85,84,217,'#8cbbc055');rect(x+164,62,7,310,'#c6d0bd18');rect(x+18,340,180,10,'#fcdb9166')}rect(0,438,W,14,'#6d8ba0');rect(0,452,W,88,'#25364a');for(let i=0;i<W;i+=72){rect(i,481,45,2,'#55738a66')}for(let i=0;i<18;i++){let x=i*88-(camera*.13)%88;rect(x+8,27,7,6,'#d5e8e955')}}
function locker(x,y){rect(x,y,85,137,'#2b5269');rect(x+5,y+5,75,124,'#3f7591');rect(x+11,y+16,62,4,'#1e4254');rect(x+11,y+27,62,4,'#1e4254');round(x+62,y+63,6,15,2,'#e5d494')}
function platform(pl){round(pl.x,pl.y,pl.w,16,5,'#466478');rect(pl.x+6,pl.y+4,pl.w-12,5,'#a5bbc2');for(let k=0;k<pl.w-30;k+=38){rect(pl.x+k+18,pl.y+16,5,22,'#203448')}}
function hero(x,y,blink){const p=player,walk=Math.sin(frame*.18)*Math.min(Math.abs(p.vx)*.9,6);ctx.save();ctx.translate(x,y);if(blink)ctx.globalAlpha=.48;round(3,54,12,5,3,'#080d19');round(21,54,12,5,3,'#080d19');rect(9+walk*.5,45,7,11,'#1b2b3f');rect(23-walk*.5,45,7,11,'#1b2b3f');round(0,15,38,34,9,'#25485e');round(3,19,32,27,9,'#3b7985');round(4,0,30,27,13,'#263850');round(8,7,22,19,8,'#e9bba2');round(10,0,19,10,7,'#243247');round(12,16,4,4,2,'#1d2837');round(24,16,4,4,2,'#1d2837');rect(17,23,7,2,'#805e62');round(28,30,9,7,3,'#27475c');ctx.restore()}
function enemy(e){let x=e.x,y=world.ground-59;ctx.save();ctx.translate(x,y);let jacket=['#d58a4c','#788a9d','#cf6492','#a37ccf'][e.kind];round(2,51,11,7,2,'#17243a');round(21,51,11,7,2,'#17243a');round(0,22,35,33,8,jacket);round(4,3,27,27,12,['#dbad89','#d6a481','#e1b3a4','#bf967d'][e.kind]);round(3,0,30,11,6,['#392f33','#253b4a','#5b3744','#4b3d42'][e.kind]);rect(11,16,4,3,'#213047');rect(23,16,4,3,'#213047');if(e.kind===1){rect(0,30,35,5,'#dce9f0');round(14,34,6,13,2,'#b84b61')}if(e.kind===2){round(9,29,16,13,6,'#f3c1cb')}if(e.kind===3){round(3,19,29,7,3,'#f6efe7')}ctx.restore();if(Math.abs(player.x-e.x)<165){round(x-15,y-34,74,24,10,'#fff');txt(['HEY!','TEST!','HUG!','MOM!'][e.kind],x+22,y-17,12,'#25334a','center',900)}}
function coinDraw(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(frame*.055)*.09);ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fillStyle='#ffdb75';ctx.fill();ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.strokeStyle='#fff4b0';ctx.lineWidth=2;ctx.stroke();txt('★',0,4,11,'#916923','center');ctx.restore()}
function scene(){background();ctx.save();if(shake>0)ctx.translate(Math.sin(frame*3)*shake*.3,0);ctx.translate(-Math.floor(camera),0);for(let x=40;x<world.world;x+=340)locker(x,world.ground-137);for(let p of world.platforms)platform(p);for(let z of world.coins)if(!z.taken)coinDraw(z.x,z.y+Math.sin(frame*.065+z.x)*5);round(world.world-92,world.ground-103,63,104,7,'#182a40');round(world.world-85,world.ground-96,49,92,3,'#88c9ab');txt('EXIT',world.world-60,world.ground-123,17,'#b9f9d3','center');for(let e of world.enemies)enemy(e);hero(player.x,player.y,player.inv>0&&Math.floor(frame/5)%2===0);ctx.restore();round(20,18,308,74,15,'#071322dc');txt('SOCIAL BATTERY',35,42,15,'#c9dbdf');round(35,52,266,17,8,'#243a4c');round(35,52,266*battery/100,17,8,battery>55?'#80e3c5':battery>25?'#ffd17f':'#fb738c');txt(world.name,480,36,22,'#fff','center');txt(world.place,480,60,13,'#9eafc7','center');round(796,18,145,62,12,'#071322dc');txt('★ '+coins,820,57,25,'#ffe18f');if(captionTimer>0)txt(caption,480,125,20,'#fce1a6','center');if(player.x<220&&frame<350)txt('ARROWS TO MOVE    ↑ / SPACE TO JUMP',480,492,18,'#e1f7fa','center')}
function overlay(title,lines,button){rect(0,0,W,H,'#07101bdc');round(174,92,612,350,24,'#15243b');round(191,108,578,316,18,'#1e3048');txt('ATELIER 452',480,148,16,'#9ae0cc','center');txt(title,480,225,title.length>20?34:46,'#fff','center',950);for(let i=0;i<lines.length;i++)txt(lines[i],480,280+i*30,18,'#c7d5e6','center',650);round(329,366,302,48,13,'#78dbc0');txt(button,480,397,20,'#132a34','center',900)}
function render(){if(state==='title'){background();overlay("DON'T TALK TO ME!",['Everyone wants something. You just want to go home.','Avoid conversations. Collect coins. Find EXIT.'], 'TAP / PRESS TO PLAY');return}scene();if(paused&&state==='play')overlay('PAUSED',['A moment of glorious silence.'],'TAP TO RESUME');if(state==='fail')overlay('SOCIAL OVERLOAD',['Too many people. Not enough alone time.','Coins collected this run: '+earned],'TAP TO TRY AGAIN');if(state==='win')overlay('ESCAPED!',['Level '+(level+1)+' / 5 complete','Coins collected: '+earned],level<4?'TAP FOR NEXT LEVEL':'TAP TO FINISH');if(state==='done')overlay('FINALLY ALONE',['You survived the school week!','Total coins: '+coins],'TAP TO PLAY AGAIN')}

})();
